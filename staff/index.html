<!doctype html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หลังร้าน · Scan &amp; Shop by TIBD</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f0">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f3ee; --surface:#ffffff; --sunk:#f8f7f2; --ink:#14233b; --ink2:#33415a; --muted:#6b778c; --line:#e7e5dd; --line2:#d9d6cc;
    --coral:#e8572f; --coral-dk:#cc4520; --coral-soft:#fde9e2; --mint:#6fd6b6; --mint-deep:#1b8a6b; --mint-soft:#e4f6ef;
    --sky-soft:#e3f1fa; --sky-deep:#1f6f99; --warn:#8a5a00; --warn-bg:#fff3d6; --bad:#b42318; --bad-bg:#fdecea;
    --r:14px; --shadow:0 1px 2px rgba(20,35,59,.05),0 6px 18px -10px rgba(20,35,59,.18);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Prompt","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5}
  button{font:inherit;color:inherit}
  a{color:inherit}
  svg{flex:none;display:block}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- โครงหน้า ---------- */
  .banner{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:6px 16px;text-align:center}
  .shell{display:flex;min-height:100vh}
  .side{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
  .logo i{width:34px;height:34px;border-radius:10px;background:var(--coral);color:#fff;display:grid;place-items:center;font-style:normal}
  .logo b{display:block;font-size:17px;line-height:1.1} .logo span{font-size:12px;color:var(--muted)}
  .nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1;overflow:auto}
  .nav button{display:flex;align-items:center;gap:11px;border:0;background:none;border-radius:10px;padding:9px 12px;font-size:14.5px;color:var(--ink2);cursor:pointer;text-align:left;width:100%}
  .nav button:hover{background:var(--sunk)}
  .nav button.on{background:var(--mint-soft);color:var(--mint-deep);font-weight:600}
  .nav .sep{height:1px;background:var(--line);margin:8px 6px}
  .badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:11.5px;font-weight:600;display:inline-grid;place-items:center}
  .me{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .ava{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
  .me .who{flex:1;min-width:0} .me .who b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .me .who span{font-size:12px;color:var(--muted)}
  .content{flex:1;min-width:0;display:flex;flex-direction:column}
  main{padding:22px 28px 40px;max-width:1180px;width:100%}
  .topbar{display:none}
  .tabbar{display:none}

  /* ---------- ส่วนหัวของแต่ละหน้า ---------- */
  .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .ph h1{margin:0;font-size:24px;line-height:1.2;font-weight:700}
  .ph p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
  .ph .acts{display:flex;gap:8px;flex-wrap:wrap}
  h2{font-size:16px;margin:22px 0 10px;font-weight:600}
  .note{font-size:12.5px;color:var(--muted)}
  .err{color:var(--bad);font-size:13.5px;margin:10px 0;background:var(--bad-bg);border-radius:10px;padding:9px 12px}
  .empty{background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r);padding:28px 16px;text-align:center;color:var(--muted)}

  /* ---------- ปุ่ม ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:10px;background:var(--coral);color:#fff;font-weight:600;font-size:14.5px;padding:9px 16px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--coral-dk)}
  .btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line2);font-weight:500} .btn.sec:hover{background:var(--sunk)}
  .btn.ghost{background:none;color:var(--ink2);font-weight:500} .btn.ghost:hover{background:var(--sunk)}
  .btn.ok{background:var(--mint-deep)} .btn.ok:hover{background:#156f56}
  .btn.danger{background:var(--surface);color:var(--bad);border-color:#f1c4bf;font-weight:500} .btn.danger:hover{background:var(--bad-bg)}
  .btn.sm{padding:5px 11px;font-size:13px;border-radius:8px}
  .btn.block{width:100%;padding:12px 16px;font-size:15.5px}
  .btn:disabled{opacity:.55;cursor:wait}
  .icon-btn{border:0;background:none;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .icon-btn:hover{background:var(--sunk);color:var(--ink)}
  .rcl{margin-bottom:6px}.rcl .lk{display:inline-flex;align-items:center;gap:4px}.rcl .note{display:block}
  .lk{border:0;background:none;color:var(--mint-deep);padding:0;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500}
  .lk:hover{text-decoration:underline}

  /* ---------- ตัวกรอง ---------- */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap;gap:2px}
  .seg button{border:0;background:none;color:var(--muted);border-radius:7px;padding:6px 12px;font-size:13.5px;cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1;min-width:200px;max-width:340px;color:var(--muted)}
  .search input{border:0 !important;outline:0 !important;padding:9px 0 !important;background:none !important;flex:1;min-width:0}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .chip .c{opacity:.7;margin-left:4px}

  /* ---------- การ์ดตัวเลข ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
  .stat .si{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
  .stat .si.c{background:var(--coral-soft);color:var(--coral)} .stat .si.m{background:var(--mint-soft);color:var(--mint-deep)}
  .stat .si.s{background:var(--sky-soft);color:var(--sky-deep)} .stat .si.w{background:var(--warn-bg);color:var(--warn)}
  .stat span{display:block;font-size:12.5px;color:var(--muted)}
  .stat b{display:block;font-size:21px;line-height:1.25;font-variant-numeric:tabular-nums;font-weight:700}
  .stat small{font-size:12px;color:var(--muted)}
  .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 12px;font-size:15px;font-weight:600}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}

  /* ---------- ป้ายสถานะ ---------- */
  .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:500;background:#eeece6;color:var(--muted);white-space:nowrap}
  .pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
  .pill.PAID,.pill.ok{background:var(--mint-soft);color:var(--mint-deep)}
  .pill.PENDING,.pill.wait{background:var(--warn-bg);color:var(--warn)}
  .pill.REVIEW,.pill.FAILED,.pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.info{background:var(--sky-soft);color:var(--sky-deep)}

  /* ---------- รายการออเดอร์ ---------- */
  .list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .lhead,.orow{display:grid;grid-template-columns:150px minmax(150px,1.1fr) minmax(170px,1.4fr) 120px 150px 170px;gap:14px;align-items:start;padding:12px 18px}
  .lhead{font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--sunk);padding-top:9px;padding-bottom:9px}
  .orow{border-bottom:1px solid var(--line);font-size:13.5px}
  .orow:last-child{border-bottom:0}
  .orow:hover{background:#fcfbf8}
  .orow .no b{display:block;font-size:14px}
  .orow .items{color:var(--ink2)}
  .orow .amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .orow .acts{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
  .lab{display:none}
  .more{padding:10px 18px;font-size:12.5px;color:var(--muted);background:var(--sunk)}

  /* ---------- สินค้า / แบรนด์ ---------- */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .pcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .pcard.off{opacity:.62}
  .pcard .img{aspect-ratio:4/3;background:#fff;border-bottom:1px solid var(--line);display:grid;place-items:center;position:relative}
  .pcard .img img{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:contain}
  .pcard .img .tagb{position:absolute;left:10px;top:10px;z-index:1}
  .pcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
  .pcard .bd b{font-size:14.5px;line-height:1.3}
  .pcard .bd .sub{font-size:12.5px;color:var(--muted)}
  .pcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}
  .pcard .price{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
  .noimg{display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);background:repeating-linear-gradient(45deg,#faf9f5,#faf9f5 8px,#f3f2ec 8px,#f3f2ec 16px);width:100%;height:100%}
  .bcard .img{aspect-ratio:16/7}
  .bcard .img img{inset:0;width:100%;height:100%;object-fit:cover}
  /* สวิตช์ */
  .tg{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--ink2);user-select:none}
  .tg input{position:absolute;opacity:0;width:0;height:0}
  .tg i{width:38px;height:22px;border-radius:999px;background:#d3d0c6;position:relative;transition:background .15s;flex:none}
  .tg i:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
  .tg input:checked + i{background:var(--mint-deep)} .tg input:checked + i:after{transform:translateX(16px)}
  .tg input:focus-visible + i{outline:2px solid var(--mint);outline-offset:2px}
  .tg input:disabled + i{opacity:.5}

  /* ---------- แถวทั่วไป (ประวัติ พนักงาน) ---------- */
  .cpcode{display:block;font-family:ui-monospace,Consolas,monospace;letter-spacing:.5px;font-size:15.5px}
  .row .main > span{display:block} .row .main > span:not(.note){font-size:13.5px}
  .seg{display:flex;gap:8px}.seg label{flex:1;margin:0}.seg input{position:absolute;opacity:0;pointer-events:none}
  .seg span{display:block;text-align:center;border:1.5px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;font-weight:500;font-size:14px}
  .seg input:checked + span{border-color:var(--mint-deep);background:var(--mint-soft);color:var(--mint-deep)}
  .seg input:focus-visible + span{outline:2px solid var(--mint);outline-offset:2px}
  .salep{color:var(--coral)} .salep s{color:var(--muted);font-weight:400;font-size:13px;margin-right:4px}
  .pill.sale{background:var(--coral-soft);color:var(--coral)}
  .row.off{opacity:.62}
  .enbox summary{cursor:pointer;list-style:revert} .enbox[open] summary{margin-bottom:4px}
  .rpt table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px} .rpt th,.rpt td{border:1px solid #ccc;padding:5px 6px;text-align:left}
  .rpt td:nth-child(n+6),.rpt th:nth-child(n+6){text-align:right} .rpt tr.g td{font-weight:700;background:#f4f4f4}
  .bacts{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .bcard .bd .note{overflow-wrap:anywhere}
  .bcard .bft{flex-direction:column;align-items:stretch;gap:10px}
  .bcard .bft .bacts{display:flex;justify-content:stretch}
  .bcard .bft .bacts .btn{flex:1 1 auto;justify-content:center;white-space:nowrap}
  .prow{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:4px 0;border-bottom:1px solid var(--line)} .prow s{color:var(--muted);font-size:12.5px}
  .rows{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  .row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .main{flex:1;min-width:0} .row .main b{font-weight:600} .row .main .note{display:block}
  .row .side-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
  .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--sunk);color:var(--muted)}
  .dot.c{background:var(--coral-soft);color:var(--coral)} .dot.m{background:var(--mint-soft);color:var(--mint-deep)} .dot.s{background:var(--sky-soft);color:var(--sky-deep)} .dot.b{background:var(--bad-bg);color:var(--bad)}

  /* ---------- กราฟ ---------- */
  .chart{display:flex;gap:8px;padding:6px 4px 26px 0}
  .yax{display:flex;flex-direction:column;justify-content:space-between;height:190px;font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
  .plot{flex:1;height:190px;display:flex;align-items:flex-end;gap:4px;border-bottom:1px solid var(--line2);
    background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
  .col{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;outline:0}
  .col .cb{width:100%;max-width:30px;background:var(--mint-deep);border-radius:5px 5px 0 0;min-height:1px}
  .col:hover .cb,.col:focus .cb{background:var(--ink)}
  .col .xl{position:absolute;top:100%;margin-top:6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
  .col .tip{display:none;position:absolute;bottom:55%;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;z-index:3;pointer-events:none;line-height:1.45}
  .col .tip b{display:block;font-weight:600}
  .col:first-child .tip{left:0;transform:none} .col:last-child .tip{left:auto;right:0;transform:none}
  .col:hover .tip,.col:focus .tip{display:block}
  table.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
  table.t th,table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
  table.t tr:last-child td{border-bottom:0}
  table.t th{color:var(--muted);font-weight:500;font-size:12.5px} table.t th:first-child,table.t td:first-child{text-align:left}
  .hb{height:6px;border-radius:999px;background:var(--mint);margin-top:5px;min-width:3px}

  /* ---------- ฟอร์ม ---------- */
  label{display:block;font-size:13px;color:var(--ink2);margin:12px 0 4px;font-weight:500}
  label .note{font-weight:400}
  input[type=text],input[type=password],input[type=date],textarea,select{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font:inherit;color:var(--ink);background:#fff}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--mint);outline-offset:0;border-color:var(--mint)}
  input:disabled{background:var(--sunk);color:var(--muted)}
  textarea{min-height:70px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .upl{display:flex;gap:12px;align-items:center}
  .upl .pv{width:84px;height:84px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:#fff;flex:none;display:grid;place-items:center}
  .upl .pv img{width:100%;height:100%;object-fit:contain}
  .upl .pv.wide{width:150px;height:70px} .upl .pv.wide img{object-fit:cover}
  .file{position:relative;overflow:hidden} .file input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .urg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .urg button{border:1.5px solid var(--line2);background:var(--surface);border-radius:12px;padding:9px 10px;text-align:left;cursor:pointer}
  .urg button b{display:block;font-size:14px} .urg button span{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
  .urg button.on.urgent{border-color:var(--bad);background:var(--bad-bg)} .urg button.on.urgent b{color:var(--bad)}
  .urg button.on.normal{border-color:var(--warn);background:var(--warn-bg)} .urg button.on.normal b{color:var(--warn)}
  .urg button.on.idea{border-color:var(--sky-deep);background:var(--sky-soft)} .urg button.on.idea b{color:var(--sky-deep)}
  .box{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:14px}

  /* ---------- หน้าต่างย่อย ---------- */
  .ov{position:fixed;inset:0;background:rgba(20,35,59,.42);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
  .dlg{background:var(--surface);width:100%;max-width:520px;border-radius:16px;box-shadow:0 20px 50px -20px rgba(20,35,59,.5);display:flex;flex-direction:column}
  .dlg.sm{max-width:420px} .dlg.wide{max-width:820px}
  .dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px}
  .dlg-h h3{margin:0;font-size:18px;font-weight:700}
  .dlg-h p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .dlg-b{padding:0 18px 6px}
  .dlg-f{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);margin-top:12px}
  .dlg-f .r{display:flex;gap:8px;margin-left:auto}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:40;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:tin .2s}
  .toast.bad{background:var(--bad)}
  @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
  .spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--mint-soft);border-top-color:var(--mint-deep);animation:sp 1s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- หน้าเข้าสู่ระบบ ---------- */
  .auth{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse at top,#e8f5ef,transparent 60%),var(--bg)}
  .auth .box2{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:0 20px 50px -24px rgba(20,35,59,.45);padding:26px 24px}
  .auth .logo{padding:0 0 14px}
  .auth h2{margin:4px 0 2px;font-size:20px}
  .auth .row2{display:flex;gap:8px;margin-top:10px}
  .auth .row2 .btn{flex:1}
  .chk{display:flex;gap:9px;align-items:flex-start;margin:14px 0 4px;font-size:13px;color:var(--ink2);font-weight:400;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--mint-deep);margin-top:2px;flex:none}

  /* ---------- ใบกำกับภาษี (พิมพ์) ---------- */

<body>
<div id="note"></div>
<div id="root"></div>
<div id="ov"></div>
<div id="toast"></div>

<script>
const SHOP_EXEC = "https://script.google.com/macros/s/AKfycbxi9Q5SFflOy3VO8acx9GLnXzew_LQxnmHxD398Dh7YTUSJfk8tMycsDQiOO9XBxt8k/exec";
(function(){
  function api(fn, args){
    return fetch(SHOP_EXEC, { method: 'POST', body: JSON.stringify({ fn: fn, args: args || [] }) })
      .then(r => { if (!r.ok) throw new Error('เชื่อมต่อระบบไม่สำเร็จ (HTTP ' + r.status + ')'); return r.json(); })
      .then(j => { if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด'); return j.data; });
  }
  function runner(h){
    return new Proxy({}, { get(_, k){
      if (k === 'withSuccessHandler') return f => runner(Object.assign({}, h, { ok: f }));
      if (k === 'withFailureHandler') return f => runner(Object.assign({}, h, { bad: f }));
      return (...args) => { api(String(k), args).then(d => { if (h.ok) h.ok(d); }, e => { if (h.bad) h.bad(e instanceof Error ? e : new Error(String(e))); }); };
    } });
  }
  window.google = { script: { run: runner({}) } };
})();
const BOOT = {"base":"https://script.google.com/macros/s/AKfycbxi9Q5SFflOy3VO8acx9GLnXzew_LQxnmHxD398Dh7YTUSJfk8tMycsDQiOO9XBxt8k/exec","shopName":"Scan & Shop by TIBD","shopUrl":"../"};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const baht = n => num(n) + ' บาท';
const pad = n => String(n).padStart(2,'0');
const TM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate = d => d.getDate()+' '+TM[d.getMonth()]+' '+(d.getFullYear()+543);
const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
const startDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const startWeek = d => { const s = startDay(d); s.setDate(s.getDate() - ((s.getDay()+6)%7)); return s; };
const startMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const STATUS_TH = {PAID:'ชำระแล้ว', PENDING:'รอชำระ', EXPIRED:'หมดเวลา', CANCELLED:'ยกเลิก', FAILED:'สร้างลิงก์ไม่สำเร็จ', REVIEW:'ต้องตรวจสอบ'};
const when = ms => ms ? thDate(new Date(ms)) + ' ' + hm(new Date(ms)) : '';

/** ไอคอนเส้น (ขนาด 24) */
const ICONS = {
  tag:'<path d="M3 12V4h8l10 10-8 8L3 12z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  orders:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  summary:'<path d="M4 20V11M10 20V5M16 20v-7M21 20H3"/>',
  products:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>',
  brands:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.6a3.5 3.5 0 010 6.8M18.5 14.3c2 .8 3 2.8 3 5.7"/>',
  bugs:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  store:'<path d="M3 9l1.6-5h14.8L21 9"/><path d="M4 9v11h16V9M9 20v-6h6v6M3 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3"/>',
  refresh:'<path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/>',
  logout:'<path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H3"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16.5 6.5l3 3"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>', check:'<path d="M5 12l5 5 9-10"/>',
  doc:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>', undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>', trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  move:'<path d="M5 12h14M13 6l6 6-6 6"/>', more:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'
};
const ic = (n, s) => `<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/** จำนวนเงินเป็นตัวอักษรไทย (1,000,001 = หนึ่งล้านเอ็ดบาทถ้วน) */
function bahtText(v){
  const D = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], U = ['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  const seg = (n, higher) => { // n < 1,000,000 ; higher = มีหลักล้านนำหน้า
    const t = String(n); let out = '';
    for (let i = 0; i < t.length; i++){ const d = +t[i], p = t.length-1-i; if (!d) continue;
      if (p === 1 && d === 1) out += 'สิบ'; else if (p === 1 && d === 2) out += 'ยี่สิบ';
      else if (p === 0 && d === 1 && (n > 1 || higher)) out += 'เอ็ด'; else out += D[d] + U[p]; }
    return out; };
  const read = n => n >= 1e6 ? read(Math.floor(n/1e6)) + 'ล้าน' + seg(n % 1e6, true) : seg(n, false);
  const st = Math.round(v*100), b = Math.floor(st/100), sg = st % 100;
  return (b ? read(b) : (sg ? '' : 'ศูนย์')) + (b || !sg ? 'บาท' : '') + (sg ? read(sg) + 'สตางค์' : 'ถ้วน');
}

const SS = {
  get(k){ try { return sessionStorage.getItem('qrstaff.'+k); } catch(e){ return null; } },
  set(k, v){ try { v == null ? sessionStorage.removeItem('qrstaff.'+k) : sessionStorage.setItem('qrstaff.'+k, v); } catch(e){} }
};
const state = {token: SS.get('token'), data:null, edit:null, bedit:null, hist:null, histBusy:false, users:null, uedit:null, pin:null, reg:null,
  sv:'orders', range:'today', st:'PAID', grp:'day', inv:null, issue:null, busy:'', err:'', q:'', pq:'', pbrand:'all', navOpen:false};

// จำเครื่อง: รหัสอยู่ใน localStorage ของเครื่องนี้เท่านั้น
const LSR = {
  get(){ try { return localStorage.getItem('qrstaff.remember'); } catch(e){ return null; } },
  set(v){ try { v ? localStorage.setItem('qrstaff.remember', v) : localStorage.removeItem('qrstaff.remember'); } catch(e){} }
};
// เก็บ error ล่าสุดในหน้า ไว้แนบตอนแจ้งปัญหา
const ERRS = [];
window.addEventListener('error', e => { ERRS.push(new Date().toTimeString().slice(0,8) + ' ' + (e.message || '')); if (ERRS.length > 5) ERRS.shift(); });

const HINT = {
  set(name){ try { localStorage.setItem('qrstaff.hint', JSON.stringify({name, exp: Date.now() + (LSR.get() ? 30 * 864e5 : 6 * 36e5)})); } catch(e){} },
  clear(){ try { localStorage.removeItem('qrstaff.hint'); } catch(e){} }
};
function signedIn(u){ state.token = u.token; SS.set('token', u.token); if (u.remember) LSR.set(u.remember); HINT.set(u.name); }
function signedOut(){ state.token = null; SS.set('token', null); state.data = null; state.users = null; state.bugs = null; HINT.clear(); }

/** เข้าระบบอัตโนมัติจากรหัสจำเครื่อง คืน true ถ้าสำเร็จ */
function resume(){
  const rt = LSR.get();
  if (!rt) return Promise.resolve(false);
  return new Promise(ok => google.script.run.withSuccessHandler(u => { signedIn(u); ok(true); })
    .withFailureHandler(() => { LSR.set(null); ok(false); }).staffResume(rt));
}

function call(fn, ...args){
  const run = () => new Promise((ok, bad) => google.script.run.withSuccessHandler(ok)
    .withFailureHandler(e => bad(e && e.message ? e : new Error(String(e))))[fn](state.token, ...args));
  return run().catch(err => {
    if (!/AUTH/.test(err.message)) throw err;
    // token 6 ชม. หมดอายุ → ลองเข้าใหม่ด้วยรหัสจำเครื่องแล้วทำซ้ำ
    return resume().then(ok => {
      if (ok) return run();
      signedOut(); render(); throw err;
    });
  });
}

/** ข้อความแจ้งผลชั่วคราวด้านล่างจอ */
let toastTimer = null;
function toast(msg, bad){
  $('toast').innerHTML = `<div class="toast ${bad ? 'bad' : ''}">${ic(bad ? 'bugs' : 'check', 16)}${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { $('toast').innerHTML = ''; }, 2600);
}

function login(){
  const name = $('who').value.trim(), pin = $('pin').value.trim(), remember = $('remember').checked;
  if (!name) { state.err = 'กรุณากรอกชื่อผู้ใช้'; return render(); }
  if (!pin) { state.err = 'กรุณากรอก PIN'; return render(); }
  state.loginName = name; state.remember = remember;
  state.busy = 'login'; state.err = ''; render();
  google.script.run.withSuccessHandler(u => { signedIn(u); state.busy = ''; load(); })
    .withFailureHandler(e => { state.busy = ''; state.err = e.message; render(); }).staffLogin(name, pin, remember);
}
function logout(){ google.script.run.staffLogout(state.token, LSR.get()); LSR.set(null); signedOut(); state.navOpen = false; render(); }
function load(manual){
  if (manual) state.busy = 'reload';
  return call('staffData').then(d => { state.data = d; state.err = ''; HINT.set(d.me.name); if (manual) toast('อัปเดตข้อมูลแล้ว'); })
    .catch(e => { state.err = e.message; }).then(() => { if (manual) state.busy = ''; render(); });
}
setInterval(() => { if (state.token && !document.hidden && !state.inv && !state.issue && !state.edit && !state.bedit && !state.uedit && !state.pin && !state.bug && !state.navOpen) load(); }, 60000);

const set = (k, v) => { state[k] = v; if (k === 'sv') { state.navOpen = false; state.err = ''; window.scrollTo(0, 0); }
  if (k === 'sv' && v === 'bugs') state.bugs = null; if (k === 'sv' && v === 'history') state.hist = null; if (k === 'sv' && v === 'users') state.users = null; render(); };
const seg = (cur, key, opts) => `<div class="seg">${opts.map(o => `<button class="${cur===o[0]?'on':''}" onclick="set('${key}','${o[0]}')">${o[1]}</button>`).join('')}</div>`;
const orders = () => state.data ? state.data.orders : [];
const paid = () => orders().filter(o => o.status === 'PAID');
const fromOf = r => { const n = new Date(); return {today:startDay(n), week:startWeek(n), month:startMonth(n), all:new Date(0)}[r].getTime(); };
const agg = os => ({n: os.length, sum: os.reduce((a,o) => a + o.total, 0), qty: os.reduce((a,o) => a + o.items.reduce((x,l) => x + l.qty, 0), 0)});
const pageHead = (title, sub, acts) => `<div class="ph"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
const loading = () => '<div class="spin"></div>';

/** หน้าต่างย่อย: key = ชื่อ state ที่ปิดเมื่อกดนอกกรอบหรือกากบาท */
function modal(key, title, body, foot, size, sub){
  return `<div class="ov" onclick="if(event.target===this)set('${key}',null)"><div class="dlg ${size || ''}" role="dialog" aria-label="${esc(title)}">
    <div class="dlg-h"><div><h3>${title}</h3>${sub ? `<p>${sub}</p>` : ''}</div><button class="icon-btn" onclick="set('${key}',null)" aria-label="ปิด">${ic('x', 20)}</button></div>
    <div class="dlg-b">${body}</div>${foot ? `<div class="dlg-f">${foot}</div>` : ''}</div></div>`;
}

// ---------------------------------------------------------------- เมนูและโครงหน้า

function navItems(){
  const d = state.data, me = d.me, nPend = orders().filter(o => o.status === 'PENDING').length;
  const items = [
    {k:'orders', t:'ออเดอร์', i:'orders', b: nPend},
    {k:'summary', t:'สรุปยอดขาย', i:'summary'},
    {k:'docs', t:'คลังใบเสร็จ / ใบกำกับ', i:'doc'},
    {k:'products', t:'สินค้า', i:'products'},
    {k:'brands', t:'แบรนด์', i:'brands'},
    {k:'coupons', t:'คูปองส่วนลด', i:'tag'},
    {k:'history', t:'ประวัติการแก้ไข', i:'history'}
  ];
  if (me.role === 'admin') items.push({k:'users', t:'พนักงาน', i:'users', b: d.usersPending}, {k:'bugs', t:'ปัญหาที่ได้รับแจ้ง', i:'bugs', b: d.bugsNew});
  return items;
}
const badge = n => n ? `<span class="badge">${n > 99 ? '99+' : n}</span>` : '';
const initial = n => esc(String(n || '?').trim().charAt(0).toUpperCase());
const logoHtml = () => `<div class="logo"><i>${ic('store', 19)}</i><div><b>หลังร้าน</b><span>${esc(BOOT.shopName || 'Scan & Shop by TIBD')}</span></div></div>`;

function accountMenu(){
  const me = state.data.me;
  return `<button onclick="goStore()">${ic('store')}ดูหน้าร้าน</button>
    <button onclick="openBug()">${ic('bugs')}แจ้งปัญหา</button>
    ${me.name !== 'TIBD' ? `<button onclick="set('pin',{err:'',busy:false})">${ic('key')}เปลี่ยน PIN</button>` : ''}
    <button onclick="logout()">${ic('logout')}ออกจากระบบ</button>`;
}

function render(){
  const d = state.data;
  $('note').innerHTML = d && d.sandbox ? '<div class="banner">โหมดทดสอบ (ChillPay sandbox) ออเดอร์ในระบบนี้ไม่ใช่เงินจริง</div>' : '';
  if (!state.token){ $('root').innerHTML = state.reg ? regView() : loginView(); $('ov').innerHTML = ''; return; }
  if (!d){ $('root').innerHTML = state.err ? `<div class="auth"><div class="box2"><div class="err">${esc(state.err)}</div><button class="btn block" onclick="load()">ลองใหม่</button></div></div>` : `<div class="auth">${loading()}</div>`; $('ov').innerHTML = ''; return; }
  const me = d.me, items = navItems();
  const view = ({orders:ordersView, summary:summaryView, products:productsView, brands:brandsView, docs:docsView, coupons:couponsView, history:historyView, users:usersView, bugs:bugsView}[state.sv] || ordersView)();
  const main4 = ['orders','summary','products'], inMore = !main4.includes(state.sv);
  const moreBadge = items.filter(x => !main4.includes(x.k)).reduce((a, x) => a + (x.b || 0), 0);
  $('root').innerHTML = `<div class="shell">
    <aside class="side">${logoHtml()}
      <nav class="nav">${items.map(x => `<button class="${state.sv === x.k ? 'on' : ''}" onclick="set('sv','${x.k}')">${ic(x.i)}${x.t}${badge(x.b)}</button>`).join('')}
        <div class="sep"></div>
        <button onclick="load(true)" ${state.busy === 'reload' ? 'disabled' : ''}>${ic('refresh')}${state.busy === 'reload' ? 'กำลังโหลด…' : 'รีเฟรชข้อมูล'}</button>
        ${accountMenu()}</nav>
      <div class="me"><div class="ava">${initial(me.name)}</div><div class="who"><b>${esc(me.name)}</b><span>${me.role === 'admin' ? 'ผู้ดูแล' : 'พนักงาน'}</span></div></div>

function register(){

    .withFailureHandler(err => { e.busy = false; e.err = err.message; render(); })[e.mode === 'forgot' ? 'staffForgotPin' : 'staffRegister'](name, pin);

function rcHtml(o){
  if (o.status !== 'PAID') return '';
  const r = o.rc, no = esc(o.no), busy = state.busy === 'rc' + o.no ? 'disabled' : '';
  if (!r) return `<div class="rcl"><button class="lk" onclick="openRcv('${no}')" ${busy}>${ic('doc', 14)}ใบเสร็จ</button></div>`;
  const ans = r.status === 'REPLACED' ? 'ยกเลิก · ใช้ใบกำกับเต็มรูปแทน'
    : r.wanted === 'yes' ? 'ลูกค้ารับ' + (r.emailed ? ' · ส่งอีเมลแล้ว' : '') : r.wanted === 'no' ? 'ลูกค้าไม่รับ' : 'ลูกค้ายังไม่ได้เลือก';
  return `<div class="rcl"><button class="lk" onclick="openRcv('${no}')" ${busy}>${ic('doc', 14)}${esc(r.no)}</button><span class="note">${ans}</span></div>`;
}
function openRcv(no){
  state.busy = 'rc' + no; render();
  call('staffReceipt', no).then(v => { state.busy = null; state.rcv = v; const o = findOrder(no); if (o) o.rc = v; render(); })
    .catch(e => { state.busy = null; render(); toast(e.message); });

  return `<div class="ov" onclick="if(event.target===this)set('rcv',null)"><div class="dlg">

/** ออเดอร์อยู่ในกลุ่มสถานะของปุ่มกรองหรือไม่ */
const inSt = (o, s) => s === 'all' || o.status === s || (s === 'PAID' && o.status === 'REVIEW') || (s === 'FAIL' && FAIL_ST.includes(o.status));
/** ลบออเดอร์ที่ไม่สำเร็จ (ลบได้เฉพาะหมดเวลา ยกเลิก สร้างลิงก์ไม่สำเร็จ) */
function deleteOrders(nos){
  if (!nos.length) return;
  if (!confirm(nos.length === 1 ? 'ลบออเดอร์ ' + nos[0] + '?' : 'ลบออเดอร์ที่ไม่สำเร็จทั้งหมด ' + nos.length + ' รายการ?')) return;
  state.busy = 'del'; render();
  call('staffDeleteOrders', nos).then(d => { state.data = d; toast('ลบแล้ว ' + nos.length + ' รายการ'); })
    .catch(e => { toast(e.message, true); }).then(() => { state.busy = ''; render(); });
}
function refresh(no){
  state.busy = no; render();

}

function allDocs(){
  const out = [];
  orders().forEach(o => {
    const buyer = [o.form.name, o.form.company].filter(Boolean).join(' · ');
    if (o.rc && o.status === 'PAID') out.push({kind:'RC', no:o.rc.no, date:o.rc.date || o.paidAt || o.ts, order:o.no, buyer, tid:'',
      total:o.total, vat:o.vat, before:o.subtotal, status:o.rc.status === 'REPLACED' ? 'REPLACED' : 'ISSUED', ref:o.rc.replacedBy,
      note: o.rc.wanted === 'yes' ? 'ลูกค้ารับ' + (o.rc.emailed ? ' · ส่งอีเมลแล้ว' : '') : o.rc.wanted === 'no' ? 'ลูกค้าไม่รับ' : 'ลูกค้ายังไม่ได้เลือก'});
    if (o.inv) out.push({kind:'IV', no:o.inv.no, date:o.inv.date, order:o.no, buyer:o.inv.name, tid:o.inv.tid + (o.inv.branch ? ' · ' + o.inv.branch : ''),
      total:o.inv.total, vat:o.inv.vat, before:o.inv.beforeVat, status:'ISSUED', note:'ใบกำกับภาษีเต็มรูป'});
  });
  return out.sort((a, b) => b.date - a.date || (a.no < b.no ? 1 : -1));
}

    (!q || [x.no, x.order, x.buyer, x.tid].join(' ').toLowerCase().includes(q)));
}

function cpState(c){
  const d = new Date(), today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  if (c.start && c.start > today) return ['ยังไม่เริ่ม', 'PENDING'];
  if (c.limit && c.used >= c.limit) return ['ใช้ครบแล้ว', 'EXPIRED'];
  return ['ใช้ได้', 'PAID'];
}

// ---------------------------------------------------------------- สรุปยอดขาย (เฉพาะออเดอร์ที่ชำระแล้ว)

function buckets(){
  const now = new Date(), out = [];
  if (state.grp === 'day') for (let i = 13; i >= 0; i--){ const s = startDay(now); s.setDate(s.getDate()-i); const e = new Date(s); e.setDate(e.getDate()+1);
    out.push({s, e, label: s.getDate()+'/'+(s.getMonth()+1), full: thDate(s)}); }
  else if (state.grp === 'week') for (let i = 7; i >= 0; i--){ const s = startWeek(now); s.setDate(s.getDate()-7*i); const e = new Date(s); e.setDate(e.getDate()+7);
    const l = new Date(e); l.setDate(l.getDate()-1); out.push({s, e, label: s.getDate()+'/'+(s.getMonth()+1), full: thDate(s)+' – '+thDate(l)}); }
  else for (let i = 5; i >= 0; i--){ const s = new Date(now.getFullYear(), now.getMonth()-i, 1), e = new Date(s.getFullYear(), s.getMonth()+1, 1);
    out.push({s, e, label: TM[s.getMonth()], full: TM[s.getMonth()]+' '+(s.getFullYear()+543)}); }
  const ps = paid();
  out.forEach(b => Object.assign(b, agg(ps.filter(o => o.ts >= b.s.getTime() && o.ts < b.e.getTime())),
    {vat: ps.filter(o => o.ts >= b.s.getTime() && o.ts < b.e.getTime()).reduce((a,o) => a + o.vat, 0)}));
  return out;
}
function chart(bs){
  const mx = Math.max(1, ...bs.map(b => b.sum)), p = Math.pow(10, Math.floor(Math.log10(mx))), top = Math.ceil(mx/p)*p;
  return `<div class="chart"><div class="yax"><span>${top.toLocaleString('th-TH')}</span><span>${(top/2).toLocaleString('th-TH')}</span><span>0</span></div>
    <div class="plot">${bs.map(b => `<div class="col" tabindex="0"><div class="cb" style="height:${b.sum/top*100}%"></div>
      <div class="tip"><b>${b.full}</b>${baht(b.sum)} · ${b.n} ออเดอร์</div><span class="xl">${b.label}</span></div>`).join('')}</div></div>`;
}

    `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">${tile('วันนี้','today','cash','m')}${tile('สัปดาห์นี้','week','summary','s')}${tile('เดือนนี้','month','orders','c')}</div>
    <div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><h3 style="margin:0">ยอดขาย (บาท) ${gl}</h3>
      ${seg(state.grp, 'grp', [['day','รายวัน'],['week','รายสัปดาห์'],['month','รายเดือน']])}</div>${chart(bs)}
      <details><summary class="note" style="cursor:pointer">ดูตัวเลขแต่ละช่วง</summary>
      <table class="t" style="margin-top:8px"><tr><th>ช่วงเวลา</th><th>ออเดอร์</th><th>ชิ้น</th><th>ยอดขาย</th><th>VAT</th></tr>
      ${bs.slice().reverse().map(b => `<tr><td>${b.full}</td><td>${b.n}</td><td>${b.qty}</td><td>${num(b.sum)}</td><td>${num(b.vat)}</td></tr>`).join('')}</table></details></div>
    <div class="cols"><div class="card"><h3>ตามแบรนด์ · 30 วัน</h3><table class="t"><tr><th>แบรนด์</th><th>ชิ้น</th><th>ยอดขาย</th></tr>
      ${byB.map(x => `<tr><td>${esc(x.name)}<div class="hb" style="width:${x.v/mb*100}%"></div></td><td>${x.q}</td><td>${num(x.v)}</td></tr>`).join('') || empty}</table></div>
    <div class="card"><h3>ตามสินค้า · 30 วัน</h3><table class="t"><tr><th>สินค้า</th><th>ชิ้น</th><th>ยอดขาย</th></tr>
      ${byP.map(x => `<tr><td>${esc(x.name)}<div class="hb" style="width:${x.v/mp*100}%"></div></td><td>${x.q}</td><td>${num(x.v)}</td></tr>`).join('') || empty}</table></div>
    <div class="card"><h3>ตามช่องทางชำระเงิน · 30 วัน</h3><table class="t"><tr><th>ช่องทาง</th><th>ออเดอร์</th><th>ยอดขาย</th></tr>
      ${Object.keys(byC).sort((a,b) => byC[b].v - byC[a].v).map(k => `<tr><td>${esc(k)}<div class="hb" style="width:${byC[k].v/mc*100}%;background:var(--sky-deep)"></div></td><td>${byC[k].n}</td><td>${num(byC[k].v)}</td></tr>`).join('') || empty}</table></div>
    ${Object.keys(byK).length ? `<div class="card"><h3>คูปองที่ใช้ · 30 วัน</h3><table class="t"><tr><th>โค้ด</th><th>ออเดอร์</th><th>ส่วนลดรวม</th></tr>
      ${Object.keys(byK).sort((a,b) => byK[b].d - byK[a].d).map(k => `<tr><td>${esc(k)}<br><span class="note">ยอดขาย ${num(byK[k].v)}</span></td><td>${byK[k].n}</td><td>${num(byK[k].d)}</td></tr>`).join('')}</table></div>` : ''}</div>
    <p class="note" style="margin-top:12px">ยอดขายรวมและตามช่องทาง = ยอดที่ลูกค้าจ่ายจริงหลังหักคูปอง · ตามแบรนด์และตามสินค้า = ราคาสินค้าก่อนหักคูปอง (หลังราคาพิเศษแล้ว)</p>`;
}

if (state.token) { render(); load(); }
else if (LSR.get()) { $('root').innerHTML = `<div class="auth">${loading()}</div>`; resume().then(ok => { render(); if (ok) load(); }); }
else render();
</script>
</body>
</html>
